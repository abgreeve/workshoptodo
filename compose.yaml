name: workshoptodo

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - database_data:/var/lib/postgresql/data

  moodle:
    image: ghcr.io/abgreeve/workshoptodo:latest
    build:
      context: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_DB_HOST: database
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: moodle
    ports:
      - "${MOODLE_PORT:-8080}:80"
    volumes:
      - moodle_data:/var/www/moodledata
      - .:/var/www/html/public/blocks/workshoptodo

volumes:
  database_data:
  moodle_data:
